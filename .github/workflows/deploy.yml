name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app is served under /presupuesto/demo/, so build with that base
      # and emit into dist/demo. The landing page is copied to the site root.
      - name: Build demo app
        run: |
          pnpm exec tsc -b
          pnpm exec vite build --base=/presupuesto/demo/ --outDir dist/demo

      - name: Assemble site (landing at root, demo under /demo)
        run: |
          cp -r landing/. dist/
          # GitHub Pages serves the custom 404 only from the site root. Point it
          # at the demo shell so deep links / refreshes inside the SPA boot the app
          # (its router basename is /presupuesto/demo, so demo routes resolve).
          cp dist/demo/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
